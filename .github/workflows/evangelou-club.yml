name: Evangelou Club foundation
on:
  push:
    paths:
      - 'wordpress/evangelou-club/**'
      - '.github/workflows/evangelou-club.yml'
  pull_request:
    paths:
      - 'wordpress/evangelou-club/**'
      - '.github/workflows/evangelou-club.yml'
jobs:
  php-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Lint plugin PHP
        run: |
          find wordpress/evangelou-club -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Smoke tests
        run: php wordpress/evangelou-club/tests/smoke.php
