name: Evangelou Club foundation
on:
  push:
    paths:
      - 'wordpress/evangelou-club/**'
      - '.github/workflows/evangelou-club.yml'
      - 'app/src/staff/**'
      - 'app/src/club/**'
      - 'app/src/index.css'
      - 'app/staff.html'
      - 'app/vite.staff.config.ts'
      - 'app/scripts/package-club-plugin.mjs'
      - 'app/package.json'
      - 'app/package-lock.json'
  pull_request:
    paths:
      - 'wordpress/evangelou-club/**'
      - '.github/workflows/evangelou-club.yml'
      - 'app/src/staff/**'
      - 'app/src/club/**'
      - 'app/src/index.css'
      - 'app/staff.html'
      - 'app/vite.staff.config.ts'
      - 'app/scripts/package-club-plugin.mjs'
      - 'app/package.json'
      - 'app/package-lock.json'

permissions:
  contents: read

env:
  # Disposable, job-local database container. Not a real credential.
  EVC_TEST_DB_HOST: 127.0.0.1
  EVC_TEST_DB_PORT: '13306'
  EVC_TEST_DB_USER: root
  EVC_TEST_DB_PASSWORD: evc-ci-disposable-container-only
  # Integration tests must FAIL (not skip) if the DB is missing.
  EVC_REQUIRE_DB: '1'

jobs:
  php-check:
    name: engine php ${{ matrix.php }} / ${{ matrix.db }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.2', '8.4']
        db: ['mysql:8.0', 'mariadb:10.11']
    defaults:
      run:
        working-directory: wordpress/evangelou-club
    env:
      EVC_CONCURRENCY_ROUNDS: '25'
      EVC_CONCURRENCY_WORKERS: '8'
    steps:
      - uses: actions/checkout@v4

      - name: Start isolated ${{ matrix.db }} container
        working-directory: .
        run: |
          extra=""
          case "${{ matrix.db }}" in
            mysql:*) extra="--default-authentication-plugin=mysql_native_password" ;;
          esac
          docker run -d --name evc-test-db -p 127.0.0.1:13306:3306 \
            -e MYSQL_ROOT_PASSWORD="$EVC_TEST_DB_PASSWORD" \
            -e MARIADB_ROOT_PASSWORD="$EVC_TEST_DB_PASSWORD" \
            "${{ matrix.db }}" $extra

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_mysql
          coverage: none
          tools: composer:v2
          ini-values: error_reporting=E_ALL, display_errors=On, zend.assertions=1

      - name: Lint plugin PHP (no vendor)
        run: find . -path ./vendor -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Dependency-free smoke checks
        run: php tests/smoke.php

      - name: Install locked dev-only test tooling (composer.lock is mandatory)
        run: |
          test -f composer.lock || { echo "::error::composer.lock missing"; exit 1; }
          composer validate --no-check-publish --no-check-all
          composer install --no-interaction --no-progress --prefer-dist

      - name: Wait for test database
        run: php tests/bin/wait-for-db.php

      - name: Unit tests
        run: vendor/bin/phpunit --testsuite unit

      - name: Integration tests (real DB, incl. concurrency, idempotency, rollback, DST)
        run: vendor/bin/phpunit --testsuite integration

      - name: Mutation tests (critical business rules)
        if: matrix.php == '8.2' && matrix.db == 'mysql:8.0'
        run: php tests/mutation/run-mutations.php

      - name: Membership entitlement mutation tests (Task 1D-B, DB-free, every PHP version)
        if: matrix.db == 'mysql:8.0'
        run: php tests/mutation/run-membership-mutations.php

      - name: Confirm sources unchanged by test runs
        working-directory: .
        run: git diff --exit-code -- wordpress/evangelou-club

  wordpress:
    name: wordpress php ${{ matrix.php }} / ${{ matrix.db }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '7.4', db: 'mysql:8.0' }
          - { php: '8.2', db: 'mysql:8.0' }
          - { php: '8.4', db: 'mysql:8.0' }
          - { php: '8.2', db: 'mariadb:10.11' }
    defaults:
      run:
        working-directory: wordpress/evangelou-club
    env:
      EVC_WP_TEST_DB_NAME: evc_wp_tests
    steps:
      - uses: actions/checkout@v4

      - name: Start isolated ${{ matrix.db }} container
        working-directory: .
        run: |
          extra=""
          case "${{ matrix.db }}" in
            mysql:*) extra="--default-authentication-plugin=mysql_native_password" ;;
          esac
          docker run -d --name evc-test-db -p 127.0.0.1:13306:3306 \
            -e MYSQL_ROOT_PASSWORD="$EVC_TEST_DB_PASSWORD" \
            -e MARIADB_ROOT_PASSWORD="$EVC_TEST_DB_PASSWORD" \
            "${{ matrix.db }}" $extra

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_mysql, mysqli
          coverage: none
          tools: composer:v2
          ini-values: error_reporting=E_ALL, display_errors=On

      - name: Install locked dev-only test tooling (WordPress core + test library)
        run: |
          test -f composer.lock || { echo "::error::composer.lock missing"; exit 1; }
          composer install --no-interaction --no-progress --prefer-dist
          for p in johnpbloch/wordpress-core wp-phpunit/wp-phpunit phpunit/phpunit yoast/phpunit-polyfills; do
            composer show "$p" | grep -E '^(name|versions)'
          done

      - name: Wait for test database
        run: php tests/bin/wait-for-db.php

      - name: Create disposable WordPress test database
        run: php tests/bin/create-wp-test-db.php

      - name: WordPress suite - staff feature flag DISABLED (default)
        run: EVC_TEST_STAFF_FLAG=disabled vendor/bin/phpunit -c phpunit-wp.xml.dist --testsuite wp-common,wp-disabled

      - name: WordPress suite - staff feature flag ENABLED (test environment only)
        run: EVC_TEST_STAFF_FLAG=enabled vendor/bin/phpunit -c phpunit-wp.xml.dist --testsuite wp-common,wp-enabled

      - name: Authorization mutation tests (real WordPress)
        if: matrix.php == '8.2' && matrix.db == 'mysql:8.0'
        run: php tests/mutation/run-wp-mutations.php

      - name: Confirm sources unchanged by test runs
        working-directory: .
        run: git diff --exit-code -- wordpress/evangelou-club

  wordpress-http:
    name: wordpress real HTTP (packaged plugin, php 8.2 / mysql:8.0)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EVC_WP_TEST_DB_NAME: evc_wp_tests_http
      EVC_HTTP_BASE: http://127.0.0.1:8089
    steps:
      - uses: actions/checkout@v4

      - name: Start isolated mysql:8.0 container
        run: |
          docker run -d --name evc-test-db -p 127.0.0.1:13306:3306 \
            -e MYSQL_ROOT_PASSWORD="$EVC_TEST_DB_PASSWORD" mysql:8.0 \
            --default-authentication-plugin=mysql_native_password

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, mysqli, curl
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build staff app and package the plugin (no deployment)
        working-directory: app
        run: |
          npm ci
          npm run package:club-plugin
          cd dist-plugin && zip -qr evangelou-club.zip evangelou-club

      - name: Locked WordPress core (dev tooling only)
        working-directory: wordpress/evangelou-club
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Assemble disposable WordPress with the PACKAGED plugin
        run: |
          WP="$RUNNER_TEMP/wp"
          cp -r wordpress/evangelou-club/vendor/johnpbloch/wordpress-core "$WP"
          mkdir -p "$WP/wp-content/plugins"
          cp -r app/dist-plugin/evangelou-club "$WP/wp-content/plugins/evangelou-club"
          echo "EVC_WP=$WP" >> "$GITHUB_ENV"
          PW="$(openssl rand -hex 24)"
          echo "::add-mask::$PW"
          echo "EVC_HTTP_PASSWORD=$PW" >> "$GITHUB_ENV"

      - name: Install disposable site
        working-directory: wordpress/evangelou-club
        run: |
          php tests/bin/wait-for-db.php
          php tests/bin/create-wp-test-db.php
          php tests/http/setup-site.php config "$EVC_WP"
          php tests/http/setup-site.php install "$EVC_WP"
          php tests/http/setup-site.php provision "$EVC_WP"

      - name: Real HTTP checks - staff flag ON (isolated CI site only)
        working-directory: wordpress/evangelou-club
        run: |
          EVC_HTTP_FLAG=on php -S 127.0.0.1:8089 -t "$EVC_WP" "$PWD/tests/http/router.php" > "$RUNNER_TEMP/server-on.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/server.pid"
          for i in $(seq 1 30); do curl -s -o /dev/null "$EVC_HTTP_BASE/wp-login.php" && break; sleep 1; done
          php tests/http/run-http-checks.php on
          kill "$(cat "$RUNNER_TEMP/server.pid")"

      - name: Real HTTP checks - staff flag OFF (default)
        working-directory: wordpress/evangelou-club
        run: |
          EVC_HTTP_FLAG=off php -S 127.0.0.1:8089 -t "$EVC_WP" "$PWD/tests/http/router.php" > "$RUNNER_TEMP/server-off.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/server.pid"
          for i in $(seq 1 30); do curl -s -o /dev/null "$EVC_HTTP_BASE/wp-login.php" && break; sleep 1; done
          php tests/http/run-http-checks.php off
          kill "$(cat "$RUNNER_TEMP/server.pid")"

      - name: Server logs (diagnostics)
        if: always()
        run: tail -n 50 "$RUNNER_TEMP"/server-*.log || true

      - name: Keep the verified plugin package as a CI artifact (not a deployment)
        uses: actions/upload-artifact@v4
        with:
          name: evangelou-club-plugin-package
          path: app/dist-plugin/evangelou-club.zip
          retention-days: 7

      - name: Confirm sources unchanged by test runs
        run: git diff --exit-code -- wordpress/evangelou-club app/src
