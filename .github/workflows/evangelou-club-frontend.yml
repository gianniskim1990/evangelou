name: Evangelou Club frontend
on:
  push:
    paths:
      - 'app/src/club/**'
      - 'app/src/staff/**'
      - 'app/src/preview/**'
      - 'app/src/customerPreview/**'
      - 'app/src/customer/**'
      - 'app/src/lib/restRoute.ts'
      - 'app/tests/club/**'
      - 'app/tests/staff/**'
      - 'app/staff.html'
      - 'app/recovery-preview.html'
      - 'app/counter-preview.html'
      - 'app/customer-preview.html'
      - 'app/customer.html'
      - 'app/vite.customer.config.ts'
      - 'app/vite.staff.config.ts'
      - 'app/scripts/package-club-plugin.mjs'
      - 'app/scripts/php-guards.mjs'
      - 'app/scripts/sample-guard.*'
      - 'app/src/index.css'
      - 'app/scripts/run-club-*.mjs'
      - 'app/scripts/check-isolated-build.mjs'
      - 'app/scripts/check-mutation-coverage.mjs'
      - 'app/scripts/mutation-shard.*'
      - 'app/scripts/isolated-build-compare.*'
      - 'app/docs/**'
      - 'app/docs/evangelou-club-api.md'
      - 'app/package.json'
      - 'app/package-lock.json'
      - 'app/tsconfig*.json'
      - '.github/workflows/evangelou-club-frontend.yml'
  pull_request:
    paths:
      - 'app/src/club/**'
      - 'app/src/staff/**'
      - 'app/src/preview/**'
      - 'app/src/customerPreview/**'
      - 'app/src/customer/**'
      - 'app/src/lib/restRoute.ts'
      - 'app/tests/club/**'
      - 'app/tests/staff/**'
      - 'app/staff.html'
      - 'app/recovery-preview.html'
      - 'app/counter-preview.html'
      - 'app/customer-preview.html'
      - 'app/customer.html'
      - 'app/vite.customer.config.ts'
      - 'app/vite.staff.config.ts'
      - 'app/scripts/package-club-plugin.mjs'
      - 'app/scripts/php-guards.mjs'
      - 'app/scripts/sample-guard.*'
      - 'app/src/index.css'
      - 'app/scripts/run-club-*.mjs'
      - 'app/scripts/check-isolated-build.mjs'
      - 'app/scripts/check-mutation-coverage.mjs'
      - 'app/scripts/mutation-shard.*'
      - 'app/scripts/isolated-build-compare.*'
      - 'app/docs/**'
      - 'app/docs/evangelou-club-api.md'
      - 'app/package.json'
      - 'app/package-lock.json'
      - 'app/tsconfig*.json'
      - '.github/workflows/evangelou-club-frontend.yml'

permissions:
  contents: read

jobs:
  # Validation: independent of the mutation shards below, so a mutation failure or
  # cancellation can never skip typecheck, lint, builds, tests, packaging, the
  # isolation check or the canary (and vice versa).
  club-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the isolated-build check needs the PR base to diff against
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Typecheck (app + api + node + Club tests)
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Build REAL staff app (separate bundle) and verify plugin package
        run: npm run package:club-plugin
      - name: Club + staff tests (fake fetch/clock, no network, TZ=UTC+14)
        run: npm run test:club
      - name: Mutation partition is exact (660 mutants, 4 shards of 165 + 165 + 165 + 165, nothing duplicated or missing)
        run: |
          node scripts/run-club-mutations.mjs --verify-partition 4
          test "$(node scripts/run-club-mutations.mjs --list | wc -l)" = "660"
      - name: Isolated-build detector can fail (canary)
        run: node scripts/check-isolated-build.mjs --canary
      - name: Non-shipped files (tests, docs, scripts, unwired modules) do not change the shipped build
        if: github.event_name == 'pull_request'
        run: node scripts/check-isolated-build.mjs --base origin/${{ github.base_ref }}
      - name: Confirm sources unchanged by test runs
        working-directory: .
        run: git diff --exit-code -- app/src app/tests app/scripts

  # Mutation testing, split into four independent jobs (STAGE-08 round 18: 660 mutants = 165 + 165 + 165 + 165; round 17: 624 mutants = 156 + 156 + 156 + 156; round 12: 617 mutants = 155 + 154 + 154 + 154, a fourth
  # shard so that a slow runner (13.4 s per mutant seen in round 8) stays far below the 60-minute limit;
  # round 11: 573 mutants = 191 + 191 + 191; round 10: 518 = 173 + 173 + 172;
  # round 8 had two shards of 228, about 30 minutes each on a normal runner and up to 51.5 on a slow one,
  # so a third shard keeps each job well inside its 60-minute limit) (shard K/4: mutants whose
  # index % 4 == K-1). Each has its own checkout, npm ci and working
  # tree. A shard passes only if it ran ALL of its mutants, every one was killed by
  # the test suite (or hung until the runner's own limit) and the sources were
  # restored. A cancelled job or a runner shutdown is an infrastructure failure and
  # is never a mutation result.
  club-mutation-shard-1:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Mutation shard 1/4 (165 mutants)
        run: node scripts/run-club-mutations.mjs --shard 1/4 --expect-total 660 --out mutation-shard-1.json
      - name: Upload the shard report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-shard-1
          path: app/mutation-shard-1.json
          if-no-files-found: warn
          retention-days: 7
      - name: Confirm sources unchanged by the mutation run
        if: always()
        working-directory: .
        run: git diff --exit-code -- app/src app/tests app/scripts

  club-mutation-shard-2:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Mutation shard 2/4 (165 mutants)
        run: node scripts/run-club-mutations.mjs --shard 2/4 --expect-total 660 --out mutation-shard-2.json
      - name: Upload the shard report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-shard-2
          path: app/mutation-shard-2.json
          if-no-files-found: warn
          retention-days: 7
      - name: Confirm sources unchanged by the mutation run
        if: always()
        working-directory: .
        run: git diff --exit-code -- app/src app/tests app/scripts

  club-mutation-shard-3:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Mutation shard 3/4 (165 mutants)
        run: node scripts/run-club-mutations.mjs --shard 3/4 --expect-total 660 --out mutation-shard-3.json
      - name: Upload the shard report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-shard-3
          path: app/mutation-shard-3.json
          if-no-files-found: warn
          retention-days: 7
      - name: Confirm sources unchanged by the mutation run
        if: always()
        working-directory: .
        run: git diff --exit-code -- app/src app/tests app/scripts


  club-mutation-shard-4:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Mutation shard 4/4 (165 mutants)
        run: node scripts/run-club-mutations.mjs --shard 4/4 --expect-total 660 --out mutation-shard-4.json
      - name: Upload the shard report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-shard-4
          path: app/mutation-shard-4.json
          if-no-files-found: warn
          retention-days: 7
      - name: Confirm sources unchanged by the mutation run
        if: always()
        working-directory: .
        run: git diff --exit-code -- app/src app/tests app/scripts
  # Proves the four shards TOGETHER covered all 660 mutants exactly once. It runs even
  # when a shard failed or was cancelled (if: always()) and then fails on the missing
  # or incomplete report, so the workflow can never be green on a partial run.
  club-mutation-coverage:
    needs: [club-mutation-shard-1, club-mutation-shard-2, club-mutation-shard-3, club-mutation-shard-4]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download the shard reports
        uses: actions/download-artifact@v4
        continue-on-error: true # a missing artifact is reported by the coverage check below
        with:
          path: app/mutation-reports
      - name: Require all four shards to have passed
        run: |
          echo "shard 1: ${{ needs.club-mutation-shard-1.result }}"
          echo "shard 2: ${{ needs.club-mutation-shard-2.result }}"
          echo "shard 3: ${{ needs.club-mutation-shard-3.result }}"
          echo "shard 4: ${{ needs.club-mutation-shard-4.result }}"
          test "${{ needs.club-mutation-shard-1.result }}" = "success"
          test "${{ needs.club-mutation-shard-2.result }}" = "success"
          test "${{ needs.club-mutation-shard-3.result }}" = "success"
          test "${{ needs.club-mutation-shard-4.result }}" = "success"
      - name: Shards together cover every mutant exactly once
        if: always()
        run: >
          node scripts/check-mutation-coverage.mjs --expect-total 660 --shards 4
          mutation-reports/mutation-shard-1/mutation-shard-1.json
          mutation-reports/mutation-shard-2/mutation-shard-2.json
          mutation-reports/mutation-shard-3/mutation-shard-3.json
          mutation-reports/mutation-shard-4/mutation-shard-4.json
